[package]
name = "kpxc-client"
version = "0.1.0"
edition = "2024"

[lib]
name = "kpxc_client"
path = "src/lib.rs"

[[bin]]
name = "kpxc-client"
path = "src/main.rs"

[dependencies]
# Pinned exactly: 0.1.0 is young and handles the security-sensitive protocol
# path. Upgrade deliberately and re-run the integration suite.
keepassxc-client = "=0.1.0"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt"] }
